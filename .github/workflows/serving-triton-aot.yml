name: Serving Triton compilation (no GPU)

on:
  push:
    branches: [serving/20261109]
    paths:
      - .github/workflows/serving-triton-aot.yml
      - tools/compile_serving_triton_offline.py
      - tools/requirements-serving-aot.txt
      - serving/candidates/**
      - serving/PATCH_MANIFEST*.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serving-triton-aot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Linux compiler wheel
        run: python -m pip install --only-binary=:all: --no-deps --require-hashes -r tools/requirements-serving-aot.txt
      - name: Compile exact frozen kernels for Hopper
        env:
          TRITON_CACHE_DIR: ${{ runner.temp }}/muse-triton-cache
        run: python tools/compile_serving_triton_offline.py --output-dir aot-artifacts
      - name: Preserve compilation reports and assemblies
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: serving-triton-aot-${{ github.sha }}
          path: aot-artifacts/
          if-no-files-found: warn
          retention-days: 14
